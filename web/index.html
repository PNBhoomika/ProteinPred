<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProtFunc · DNA to function hypotheses</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#13251f;background:#f3f7f4}body{max-width:940px;margin:0 auto;padding:32px 20px}header{display:flex;align-items:center;justify-content:space-between}h1{margin:0;color:#116149}#banner{background:#fff0c2;border:1px solid #e6c75c;padding:8px 12px;border-radius:8px;font-weight:650}textarea{width:100%;min-height:170px;padding:14px;border:1px solid #b8c9bf;border-radius:10px;font:14px/1.5 ui-monospace,monospace;box-sizing:border-box}button{background:#116149;color:white;border:0;border-radius:8px;padding:11px 18px;font-size:16px;cursor:pointer;margin:12px 0}button:disabled{opacity:.6}.card{background:white;border:1px solid #dce7df;border-radius:12px;padding:16px;margin:16px 0}.aspects{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.term{margin:12px 0}.bar{height:7px;background:#e4eee8;border-radius:6px;overflow:hidden}.bar span{height:100%;display:block;background:#35a77b}.muted{color:#62736a}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0}#error{color:#a32222}
</style></head><body>
<header><h1>ProtFunc</h1><span id="banner">Checking model…</span></header>
<p>Translate a DNA sequence into a protein and explore ranked Gene Ontology predictions.</p>
<div class="card"><label for="dna"><strong>DNA sequence (ACGTN; FASTA header accepted)</strong></label><textarea id="dna" placeholder=">example\nATG..."></textarea><button id="go">Predict functions</button><div id="error"></div></div>
<section id="out" hidden><div class="card"><h2>Longest ORF</h2><p id="orf"></p><h3>Protein</h3><pre id="protein"></pre></div><h2>GO predictions</h2><div class="aspects" id="predictions"></div><p class="muted">These are computational hypotheses, not experimentally validated functions.</p></section>
<script>
const banner=document.querySelector('#banner'); fetch('/health').then(r=>r.json()).then(x=>{banner.textContent=x.demo_model?'DEMO MODEL · illustrative predictions':'Trained model'; if(x.demo_model)banner.title='Scores are for testing the interface only.'}).catch(()=>banner.textContent='API unavailable');
document.querySelector('#go').onclick=async()=>{const b=document.querySelector('#go'),err=document.querySelector('#error');b.disabled=true;err.textContent='';try{const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dna:document.querySelector('#dna').value})});const x=await r.json();if(!r.ok)throw Error(Array.isArray(x.detail) ? x.detail.map(d=>d.msg).join('; ') : (x.detail || 'Prediction failed'));document.querySelector('#out').hidden=false;document.querySelector('#orf').textContent=`Frame ${x.orf.frame}; bases ${x.orf.start}–${x.orf.end}; ${x.orf.complete?'complete':'partial'}; ${x.orf.other_candidates} other candidates`;document.querySelector('#protein').textContent=x.protein;const root=document.querySelector('#predictions');root.replaceChildren();for(const [a,items] of Object.entries(x.predictions)){const card=document.createElement('div');card.className='card';const h=document.createElement('h3');h.textContent=a==='MF'?'Molecular Function':a==='BP'?'Biological Process':'Cellular Component';card.append(h);for(const t of items){const d=document.createElement('div');d.className='term';const label=document.createElement('div');label.textContent=`${t.go_id} · ${t.name} (${(t.score*100).toFixed(1)}%)`;const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('span');fill.style.width=`${Math.max(0,Math.min(100,t.score*100))}%`;bar.append(fill);d.append(label,bar);card.append(d)}root.append(card)}}catch(e){err.textContent=e.message}finally{b.disabled=false}};
</script></body></html>
